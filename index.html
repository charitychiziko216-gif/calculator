<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <div class="screen">
      <div id="expression" class="expression" aria-hidden="true"></div>
      <output id="display" class="display" aria-live="polite">0</output>
    </div>

    <div id="keys" class="keys">
      <button class="key key--utility" data-action="clear">Clear</button>
      <button class="key key--utility" data-action="backspace" aria-label="Backspace">&#9003;</button>
      <button class="key key--operator" data-operator="/" aria-label="Divide">&divide;</button>
      <button class="key key--operator" data-operator="*" aria-label="Multiply">&times;</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key--operator" data-operator="-" aria-label="Subtract">&minus;</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key key--operator" data-operator="+" aria-label="Add">+</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>

      <button class="key key--zero" data-digit="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
    </div>

    
  </main>

  <script src="script.js"></script>
</body>
</html>
